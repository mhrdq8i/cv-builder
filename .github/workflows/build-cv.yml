name: Build CV

on:
  push:
    branches: [master]
    paths:
      - "**.typ"
      - ".github/workflows/build-cv.yml"
  pull_request:
    paths:
      - "**.typ"
  workflow_dispatch:

# Needed to create/update the release that hosts the PDF.
permissions:
  contents: write

env:
  TYPST_VERSION: "0.13.1"
  NERD_FONTS_VERSION: "v3.5.0"
  TERMES_VERSION: "2.004"
  PDF_NAME: "MehrdadQasemkhani-CV.pdf"
  RELEASE_TAG: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22

    # Alpine ships busybox ash, not bash, so every run step uses sh.
    defaults:
      run:
        shell: sh

    steps:
      # Must run before anything else: the base image has neither git (which
      # actions/checkout needs) nor the tools the later steps rely on.
      - name: Install container prerequisites
        run: |
          apk add --no-cache \
            git curl tar xz unzip github-cli \
            fontconfig font-dejavu

      - name: Checkout
        uses: actions/checkout@v4

      # Container jobs run as root while the workspace is owned by the runner
      # user, so git refuses it as "dubious ownership". actions/checkout marks
      # the directory safe only for itself, not for later run steps.
      - name: Trust the workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # The musl target is the native fit for Alpine.
      - name: Install Typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ
          mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          chmod 0755 /usr/local/bin/typst
          typst --version

      - name: Cache fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-${{ env.NERD_FONTS_VERSION }}-termes-${{ env.TERMES_VERSION }}

      # Hermit's patched family is named "Hurmit"; Recursive supplies the
      # RecMonoCasual / RecMonoDuotone / RecMonoLinear families. TeX Gyre Termes
      # stands in for Times New Roman, which is not redistributable and has no
      # Alpine package - main.typ lists it as the fallback face.
      - name: Download fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          for family in 0xProto CodeNewRoman Hermit Recursive; do
            curl -fsSL -o "${family}.zip" \
              "https://github.com/ryanoasis/nerd-fonts/releases/download/${NERD_FONTS_VERSION}/${family}.zip"
            unzip -qo "${family}.zip" -d "fonts/${family}"
          done
          curl -fsSL -o termes.zip \
            "https://www.gust.org.pl/projects/e-foundry/tex-gyre/termes/qtm${TERMES_VERSION}otf.zip"
          unzip -qo termes.zip -d fonts/termes

      - name: Build PDF
        run: typst compile main.typ --font-path fonts "${PDF_NAME}"

      - name: Verify every requested font resolved
        run: |
          missing=$(typst compile main.typ --font-path fonts /dev/null 2>&1 \
            | grep -i "unknown font family" \
            | grep -iv "times new roman" || true)
          if [ -n "$missing" ]; then
            echo "::error::Fonts failed to resolve:"
            echo "$missing"
            exit 1
          fi
          echo "All fonts resolved (Times New Roman falls back to TeX Gyre Termes by design)."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: ${{ env.PDF_NAME }}
          if-no-files-found: error

      # Publishes to a stable URL:
      # https://github.com/mhrdq8i/cv-builder/releases/latest/download/MehrdadQasemkhani-CV.pdf
      - name: Publish PDF to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          # Lets gh resolve the repo directly instead of shelling out to git.
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${PDF_NAME}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${PDF_NAME}" \
              --title "Latest CV" \
              --notes "Automatically built from ${GITHUB_SHA}. Always the newest build."
          fi
